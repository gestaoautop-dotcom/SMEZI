name: Leonardo official AI integration checks
on:
  pull_request:
    paths:
      - 'server/official-ai.mjs'
      - 'server/worker.mjs'
      - 'ai-lab.html'
      - 'ai-lab.js'
      - 'scripts/build-content-engine.js'
      - 'test/official-ai.test.mjs'
      - 'package.json'
      - '.github/workflows/leonardo-official-ai.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
