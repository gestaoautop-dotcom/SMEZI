name: Leonardo CI (testes completos)
on:
  pull_request:
    branches: [feature/content-engine-caroline-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # O build vem antes porque os testes de runtime usam dist/_worker.js.
      - run: npm run build
      - run: npm test
