name: Deploy Leonardo Conversations Worker to Cloudflare

# Explicit manual deployment only. No push/PR deployment and no changes to Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-consumer:
    name: Publish isolated consumer (auto replies disabled)
    runs-on: ubuntu-latest
    environment: leonardo-cloudflare
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify webhook security
        run: node --test test/conversations-webhook.test.mjs
      - name: Build main Leonardo (regression guard)
        run: npm run build
      - name: Deploy isolated consumer
        run: npx wrangler deploy --config wrangler.conversations.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
