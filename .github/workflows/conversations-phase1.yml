name: Leonardo Conversations — Phase 1 checks
on:
  pull_request:
    paths:
      - 'server/conversations-*.mjs'
      - 'server/worker.mjs'
      - 'test/conversations-*.mjs'
      - 'workers/conversations-*.mjs'
      - 'migrations/0003_conversations_phase1.sql'
      - 'package.json'
      - '.github/workflows/conversations-phase1.yml'
  workflow_dispatch:
jobs:
  webhook-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test test/conversations-webhook.test.mjs
      - run: npm run build
