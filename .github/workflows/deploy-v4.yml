name: Deploy SMEZI V4 to GitHub Pages
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/deploy-v4.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-v4"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          ref: v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload V4
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
