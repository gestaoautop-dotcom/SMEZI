<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo HYDRORS — SMEZI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#eef4ff;color:#13233f}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.panel{background:#fff;padding:22px;border-right:1px solid #dce4f0}.panel h1{margin:0 0 28px}.search{width:100%;padding:12px;border:1px solid #dbe4ef;border-radius:12px}.layers{display:grid;gap:10px;margin-top:28px}.layers label{display:flex;gap:8px;align-items:center}.map{position:relative;overflow:hidden;background:linear-gradient(145deg,#d9e7ff,#f3f8ff)}.water{position:absolute;inset:-25%;background:repeating-radial-gradient(ellipse at 33% 55%,transparent 0 28px,rgba(44,116,225,.34) 29px 32px,transparent 33px 67px);transform:rotate(-12deg)}.pin{position:absolute;width:14px;height:14px;background:#2b74e1;border:3px solid #fff;border-radius:50%;box-shadow:0 3px 12px #6583aa}.p1{left:55%;top:42%}.p2{left:66%;top:62%}.p3{left:44%;top:70%}.detail{position:absolute;right:24px;top:24px;width:260px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(53,83,125,.18)}.detail small{color:#6f8098}.back{position:absolute;right:24px;bottom:24px;background:#13233f;color:#fff;padding:12px 16px;border-radius:999px;text-decoration:none}@media(max-width:720px){.app{grid-template-columns:1fr}.panel{border-right:0}.map{min-height:620px}.detail{left:20px;right:20px;width:auto}}</style></head><body>
<div class="app"><aside class="panel"><h1>HYDRORS</h1><input class="search" placeholder="Buscar rio, arroio, bacia..."><div class="layers"><b>Camadas</b><label><input type="checkbox" checked> Rios</label><label><input type="checkbox" checked> Arroios</label><label><input type="checkbox"> Nascentes</label><label><input type="checkbox"> Lagos</label><label><input type="checkbox" checked> Bacias</label></div></aside><main class="map"><div class="water"></div><span class="pin p1"></span><span class="pin p2"></span><span class="pin p3"></span><div class="detail"><small>Elemento selecionado</small><h2>Arroio exemplo</h2><p>Camada hidrográfica ativa. Esta demo demonstra a organização de filtros, busca e painel de contexto.</p></div><a class="back" href="../index.html">← Cases SMEZI</a></main></div></body></html>
